<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git Issue Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- search bar and search button -->
  <header>
    <h1>GitHub Issue Tracker</h1>  

    <div class="search-container">
      <input id ="repo-input" type="text" placeholder="Search repo eg(:facebook/react)">
      <button id="search-btn">Search</button>
    </div>
  </header>

  <!-- view error message  -->
  <p id="errorMessage"></p>

  <!-- main section -->
  <main>

    <!-- section 1 = open issues -->

    <section class="column">
      <h2>Open</h2>
      <div class="card" id="open-Cards"></div>
    </section>

    <!-- section 2 = reviwed issues -->

    <section class="column">
      <h2>Reviwed</h2>
      <div class="card" id="review-Cards"></div>
    </section>


    <!-- section 3 = closed issues  -->

    <section class="column">
      <h2>Closed</h2>
      <div class="card" id="closed-Cards"></div>
    </section>


  </main>

  <script src="script.js"></script>
</body>
</html>
